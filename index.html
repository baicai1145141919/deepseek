<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 中转站</title>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:#0b0b0f; color:#e6e6e6; -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; cursor:pointer; }

  /* ===== 锁屏 ===== */
  #lockScreen {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(900px 500px at 50% 30%, #16161f, #0b0b0f 70%);
    z-index:50;
  }
  .lock-card {
    width:340px; max-width:90vw; padding:34px 30px; text-align:center;
    background:#16161d; border:1px solid #26262f; border-radius:14px;
  }
  .lock-logo {
    font-size:26px; font-weight:700; letter-spacing:.5px;
    background:linear-gradient(90deg,#4d6bfe,#7c5cff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lock-sub { color:#9aa0ab; font-size:13px; margin:8px 0 22px; }
  #pwInput {
    width:100%; padding:12px 14px; font-size:15px; color:#e6e6e6;
    background:#0f0f15; border:1px solid #2c2c38; border-radius:9px; outline:none;
  }
  #pwInput:focus { border-color:#4d6bfe; }
  #unlockBtn {
    width:100%; margin-top:14px; padding:11px; font-size:15px; font-weight:600; color:#fff;
    background:#4d6bfe; border:none; border-radius:9px;
  }
  #unlockBtn:hover { background:#3f5cf0; }
  .pw-err { color:#ff6b6b; font-size:13px; margin-top:12px; min-height:16px; }

  /* ===== 主界面 ===== */
  #app { display:flex; height:100vh; }
  #sidebar {
    width:240px; flex:0 0 240px; background:#101015; border-right:1px solid #1d1d25;
    display:flex; flex-direction:column; padding:14px 12px;
  }
  .sb-brand {
    font-size:18px; font-weight:700; padding:6px 8px 14px;
    background:linear-gradient(90deg,#4d6bfe,#7c5cff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sb-new {
    text-align:left; padding:10px 12px; font-size:14px; color:#e6e6e6;
    background:#1a1a22; border:1px solid #2a2a34; border-radius:9px;
  }
  .sb-new:hover { background:#22222c; }
  .sb-hint { margin-top:auto; color:#6b7180; font-size:11px; padding:8px; line-height:1.5; }

  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar {
    height:52px; flex:0 0 52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; border-bottom:1px solid #1d1d25;
  }
  .model-tag { font-size:14px; color:#cfd3db; font-weight:600; }
  .gear {
    width:34px; height:34px; border-radius:8px; border:1px solid #2a2a34; background:#16161d; color:#b9bfc9; font-size:16px;
  }
  .gear:hover { background:#22222c; }

  #messages { flex:1; overflow-y:auto; padding:24px 0; }
  .msg { max-width:760px; margin:0 auto 18px; padding:0 20px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .msg.user .bubble {
    background:#2a2f3a; color:#eef1f6; padding:11px 15px; border-radius:14px 14px 4px 14px;
    max-width:80%; white-space:pre-wrap; word-break:break-word; font-size:14.5px; line-height:1.65;
  }
  .msg.ai .bubble {
    width:100%; color:#e6e6e6; font-size:14.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word;
  }
  .think { color:#8a90a0; font-size:12.5px; border-left:2px solid #3a3a48; padding:4px 0 4px 12px; margin:0 0 10px; white-space:pre-wrap; }
  .bubble pre { background:#0d0d12; border:1px solid #26262f; border-radius:8px; padding:12px 14px; overflow:auto; }
  .bubble code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  .bubble :not(pre) > code { background:#26262f; padding:1px 5px; border-radius:4px; }
  .typing::after { content:"▍"; animation:blink 1s steps(2) infinite; color:#6b7180; }
  @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

  #inputArea { flex:0 0 auto; padding:14px 20px 18px; border-top:1px solid #1d1d25; }
  .input-box {
    max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:#16161d; border:1px solid #2a2a34; border-radius:14px; padding:10px 12px;
  }
  .input-box:focus-within { border-color:#4d6bfe; }
  #input {
    flex:1; resize:none; border:none; outline:none; background:transparent; color:#e6e6e6;
    font-size:15px; line-height:1.6; max-height:160px; min-height:24px; padding:4px 2px;
  }
  #input::placeholder { color:#6b7180; }
  .send {
    width:38px; height:38px; flex:0 0 38px; border-radius:10px; border:none; color:#fff; background:#4d6bfe; font-size:18px;
  }
  .send:disabled { background:#2a2a34; color:#6b7180; cursor:default; }
  .input-tip { max-width:760px; margin:8px auto 0; color:#6b7180; font-size:11.5px; text-align:center; }

  /* ===== 设置弹窗 ===== */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:40; }
  .modal-card { width:380px; max-width:92vw; background:#16161d; border:1px solid #2a2a34; border-radius:14px; padding:22px; }
  .modal-title { font-size:17px; font-weight:700; margin-bottom:16px; }
  .modal-card label { display:block; font-size:13px; color:#b9bfc9; margin-bottom:7px; }
  #cfgKey { width:100%; padding:11px 13px; font-size:14px; color:#e6e6e6; background:#0f0f15; border:1px solid #2a2a34; border-radius:9px; outline:none; }
  #cfgKey:focus { border-color:#4d6bfe; }
  .modal-tip { color:#6b7180; font-size:11.5px; margin:12px 0 18px; line-height:1.6; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
  .btn-primary { padding:9px 18px; font-size:14px; color:#fff; background:#4d6bfe; border:none; border-radius:9px; }
  .btn-ghost { padding:9px 18px; font-size:14px; color:#cfd3db; background:transparent; border:1px solid #2a2a34; border-radius:9px; }
</style>
</head>
<body>

<!-- 锁屏 -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">DeepSeek</div>
    <div class="lock-sub">中转站 · 请输入访问密码</div>
    <input id="pwInput" type="password" placeholder="访问密码" autocomplete="off">
    <button id="unlockBtn">进入</button>
    <div id="pwErr" class="pw-err"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-brand">DeepSeek</div>
    <button id="newChatBtn" class="sb-new">+ 新建对话</button>
    <div class="sb-hint">本页由浏览器直连 DeepSeek 官方接口；密钥仅存本机浏览器，不会上传。</div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="model-tag" id="modelTag">deepSeek v4.1</div>
      <button id="gearBtn" class="gear" title="设置">⚙</button>
    </header>
    <div id="messages"></div>
    <div id="inputArea">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息…"></textarea>
        <button id="sendBtn" class="send">↑</button>
      </div>
      <div class="input-tip">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal" style="display:none">
  <div class="modal-card">
    <div class="modal-title">设置</div>
    <label for="cfgKey">API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
    <div class="modal-tip">模型：deepSeek v4.1 · 接口：官方 <code>api.deepseek.com</code>（已内置）。密钥仅保存在本机浏览器。</div>
    <div class="modal-actions">
      <button id="cfgSave" class="btn-primary">保存</button>
      <button id="cfgClose" class="btn-ghost">取消</button>
    </div>
  </div>
</div>

<script>
/* ===== 纯 JS SHA-256（已与 hashlib 比对一致） ===== */
function sha256(msg){
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}
  var K=new Int32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  var H=new Int32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  var utf8=unescape(encodeURIComponent(msg));
  var len=utf8.length, k=(len+1+8+63)&~63, msg32=new Int32Array(k/4);
  for(var i=0;i<len;i++){ msg32[i>>2] |= (utf8.charCodeAt(i)&0xff) << (24-(i&3)*8); }
  msg32[len>>2] |= 0x80 << (24-(len&3)*8);
  msg32[k/4-1]=len*8;
  var w=new Int32Array(64);
  for(var chunk=0;chunk<k;chunk+=64){
    for(var t=0;t<16;t++) w[t]=msg32[(chunk>>2)+t];
    for(var t=16;t<64;t++){ var s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3); var s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(var t=0;t<64;t++){ var S1=rotr(e,6)^rotr(e,11)^rotr(e,25); var ch=(e&f)^((~e)&g); var t1=(h+S1+ch+K[t]+w[t])|0; var S0=rotr(a,2)^rotr(a,13)^rotr(a,22); var maj=(a&b)^(a&c)^(b&c); var t2=(S0+maj)|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var hex=''; for(var i=0;i<8;i++) hex+=(H[i]>>>0).toString(16).padStart(8,'0');
  return hex;
}

/* 密码仅以 SHA-256 哈希形式存在源码中，不存放明文 */
var ACCESS_HASH = '5358dbe02fb4fc554453bb4720209767e08c6e592d23b7966e822e44ba43628b';

/* 固定配置（界面隐藏：接口地址 + 温度） */
var API_BASE = 'https://api.deepseek.com';
var MODEL    = 'deepseek-v4.1';
var TEMP     = 1;

var els = {
  lock: document.getElementById('lockScreen'),
  pw: document.getElementById('pwInput'),
  unlock: document.getElementById('unlockBtn'),
  pwErr: document.getElementById('pwErr'),
  app: document.getElementById('app'),
  messages: document.getElementById('messages'),
  input: document.getElementById('input'),
  send: document.getElementById('sendBtn'),
  newChat: document.getElementById('newChatBtn'),
  gear: document.getElementById('gearBtn'),
  modal: document.getElementById('settingsModal'),
  cfgKey: document.getElementById('cfgKey'),
  cfgSave: document.getElementById('cfgSave'),
  cfgClose: document.getElementById('cfgClose')
};

/* ===== 解锁 ===== */
function tryUnlock(){
  var v = els.pw.value;
  if (sha256(v) === ACCESS_HASH){
    els.lock.style.display = 'none';
    els.app.style.display = 'flex';
    loadCfg();
    if (!localStorage.getItem('ds_key')) openSettings();
  } else {
    els.pwErr.textContent = '密码错误';
    els.pw.value = '';
  }
}
els.unlock.onclick = tryUnlock;
els.pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });

/* ===== 设置 ===== */
function loadCfg(){ els.cfgKey.value = localStorage.getItem('ds_key') || ''; }
function openSettings(){ loadCfg(); els.modal.style.display = 'flex'; els.cfgKey.focus(); }
function closeSettings(){ els.modal.style.display = 'none'; }
els.gear.onclick = openSettings;
els.cfgClose.onclick = closeSettings;
els.cfgSave.onclick = function(){
  localStorage.setItem('ds_key', els.cfgKey.value.trim());
  closeSettings();
};
els.modal.addEventListener('click', function(e){ if (e.target === els.modal) closeSettings(); });

/* ===== 会话状态 ===== */
var history = [];
var controller = null;

els.newChat.onclick = function(){
  if (controller) controller.abort();
  history = [];
  els.messages.innerHTML = '';
  els.input.value = '';
  autoGrow();
};

function autoGrow(){
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 160) + 'px';
}
els.input.addEventListener('input', autoGrow);
els.input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

function addMsg(role){
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.appendChild(bubble);
  els.messages.appendChild(wrap);
  els.messages.scrollTop = els.messages.scrollHeight;
  return bubble;
}

function renderMarkdownLite(text){
  var esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  esc = esc.replace(/```([\s\S]*?)```/g, function(_, c){ return '<pre><code>'+c.replace(/^\n/,'')+'</code></pre>'; });
  esc = esc.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return esc;
}

/* ===== 发送（流式） ===== */
function send(){
  var text = els.input.value.trim();
  if (!text) return;
  var key = localStorage.getItem('ds_key');
  if (!key){ openSettings(); return; }

  var ub = addMsg('user');
  ub.textContent = text;
  history.push({ role:'user', content:text });
  els.input.value = '';
  autoGrow();

  var ab = addMsg('ai');
  ab.classList.add('typing');
  var thinkEl = null, full = '', reasoning = '';

  controller = new AbortController();
  els.send.disabled = true;
  els.send.textContent = '■';

  fetch(API_BASE + '/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({ model:MODEL, messages:history, temperature:TEMP, stream:true }),
    signal: controller.signal
  }).then(function(r){
    if (!r.ok){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,200)); }); }
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    function pump(){
      return reader.read().then(function(res){
        if (res.done){
          ab.classList.remove('typing');
          if (full) history.push({ role:'assistant', content:full });
          return;
        }
        buf += dec.decode(res.value, { stream:true });
        var parts = buf.split('\n'); buf = parts.pop();
        for (var i=0;i<parts.length;i++){
          var line = parts[i].trim();
          if (!line || !line.startsWith('data:')) continue;
          var data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            var j = JSON.parse(data);
            var d = j.choices && j.choices[0] && j.choices[0].delta;
            if (!d) continue;
            if (d.reasoning_content){ reasoning += d.reasoning_content; }
            if (d.content){ full += d.content; }
          } catch(e){ continue; }
        }
        // 渲染：思考过程 + 正文
        var html = '';
        if (reasoning) html += '<div class="think">'+renderMarkdownLite(reasoning)+'</div>';
        html += renderMarkdownLite(full);
        ab.innerHTML = html;
        els.messages.scrollTop = els.messages.scrollHeight;
        return pump();
      });
    }
    return pump();
  }).catch(function(err){
    ab.classList.remove('typing');
    if (err.name === 'AbortError'){ if (full) history.push({ role:'assistant', content:full }); ab.innerHTML = renderMarkdownLite(full); }
    else { ab.textContent = '请求失败：' + err.message + '\n（确认 API Key 正确、接口可达）'; }
  }).then(function(){
    controller = null;
    els.send.disabled = false;
    els.send.textContent = '↑';
  });
}

els.send.onclick = function(){
  if (controller){ controller.abort(); }
  else { send(); }
};
</script>
</body>
</html>
