<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 中转站</title>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:#0b0b0f; color:#e6e6e6; -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; cursor:pointer; }

  /* 锁屏样式已移除（无密码门禁） */

  /* ===== 主界面 ===== */
  #app { display:flex; height:100vh; }

  /* ===== 主界面 ===== */
  #app { display:flex; height:100vh; }

  #sidebar {
    width:240px; flex:0 0 240px; background:#101015; border-right:1px solid #1d1d25;
    display:flex; flex-direction:column; padding:14px 12px;
  }
  .sb-brand {
    font-size:18px; font-weight:700; padding:6px 8px 14px;
    background:linear-gradient(90deg,#4d6bfe,#7c5cff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sb-new {
    text-align:left; padding:10px 12px; font-size:14px; color:#e6e6e6;
    background:#1a1a22; border:1px solid #2a2a34; border-radius:9px;
  }
  .sb-new:hover { background:#22222c; }
  .sb-hint { margin-top:auto; color:#6b7180; font-size:11px; padding:8px; line-height:1.5; }
  .sb-sessions { flex:1; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:4px; }
  .sb-sessions::-webkit-scrollbar { width:6px; }
  .sb-sessions::-webkit-scrollbar-thumb { background:#26262f; border-radius:3px; }
  .sb-session {
    padding:9px 12px; font-size:13px; color:#b9bfc9; border-radius:8px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sb-session:hover { background:#1a1a22; }
  .sb-session.active { background:#22222c; color:#fff; }

  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar {
    height:52px; flex:0 0 52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; border-bottom:1px solid #1d1d25;
  }
  .model-tag { font-size:14px; color:#cfd3db; font-weight:600; }
  .gear {
    width:34px; height:34px; border-radius:8px; border:1px solid #2a2a34; background:#16161d; color:#b9bfc9; font-size:16px;
  }
  .gear:hover { background:#22222c; }

  #messages { flex:1; overflow-y:auto; padding:24px 0; }
  .msg { max-width:760px; margin:0 auto 18px; padding:0 20px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .msg.user .bubble {
    background:#2a2f3a; color:#eef1f6; padding:11px 15px; border-radius:14px 14px 4px 14px;
    max-width:80%; white-space:pre-wrap; word-break:break-word; font-size:14.5px; line-height:1.65;
  }
  .msg.ai .bubble {
    width:100%; color:#e6e6e6; font-size:14.5px; line-height:1.75; white-space:normal; word-break:break-word;
  }
  .think-box { margin:0 0 12px; border:1px solid #2a2a34; border-radius:9px; background:#13131a; overflow:hidden; }
  .think-box > summary {
    cursor:pointer; list-style:none; padding:9px 12px; font-size:12.5px; color:#9aa0ab;
    user-select:none; display:flex; align-items:center; gap:7px;
  }
  .think-box > summary::-webkit-details-marker { display:none; }
  .think-box > summary .chev { font-size:10px; color:#6b7180; transition:transform .15s; }
  .think-box[open] > summary .chev { transform:rotate(90deg); }
  .think-box > summary .tlabel { flex:1; }
  .think-box > summary .tstate { color:#6b7180; font-size:11.5px; }
  .think-body {
    padding:2px 14px 12px; margin:0 0 0 12px; color:#8a90a0; font-size:12.5px; line-height:1.75;
    border-left:2px solid #3a3a48; white-space:pre-wrap; word-break:break-word;
  }
  .think-body.empty { color:#6b7180; font-style:italic; }
  .think-body.typing::after { content:"▍"; animation:blink 1s steps(2) infinite; color:#6b7180; }
  .bubble pre { background:#0d0d12; border:1px solid #26262f; border-radius:8px; padding:12px 14px; overflow:auto; }
  .bubble code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  .bubble :not(pre) > code { background:#26262f; padding:1px 5px; border-radius:4px; }
  .bubble p { margin:0 0 10px; }
  .bubble p:last-child { margin-bottom:0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 { margin:14px 0 8px; line-height:1.3; font-weight:600; }
  .bubble h1 { font-size:21px; } .bubble h2 { font-size:18.5px; } .bubble h3 { font-size:16.5px; }
  .bubble h4 { font-size:15px; } .bubble h5 { font-size:14px; } .bubble h6 { font-size:13px; }
  .bubble ul, .bubble ol { margin:0 0 10px; padding-left:22px; }
  .bubble li { margin:3px 0; }
  .bubble blockquote { margin:0 0 10px; padding:6px 12px; border-left:3px solid #3a3a48; color:#aab0bd; background:#16161d; border-radius:0 6px 6px 0; }
  .bubble hr { border:none; border-top:1px solid #2c2c38; margin:14px 0; }
  .bubble a { color:#7aa2ff; text-decoration:underline; }
  .bubble strong { font-weight:700; color:#f2f3f5; }
  .bubble em { font-style:italic; }
  .bubble del { color:#9aa0ab; }
  .bubble .md-table { width:100%; overflow:auto; margin:0 0 12px; }
  .bubble table { border-collapse:collapse; width:100%; font-size:13.5px; }
  .bubble th, .bubble td { border:1px solid #2c2c38; padding:7px 10px; text-align:left; vertical-align:top; }
  .bubble th { background:#17171f; color:#e6e6e6; font-weight:600; }
  .bubble tbody tr:nth-child(odd) td { background:#121218; }
  .bubble ul.task-list { list-style:none; padding-left:4px; }
  .bubble li.task { list-style:none; display:flex; align-items:flex-start; gap:8px; }
  .bubble li.task input { margin-top:4px; accent-color:#4d6bfe; }
  .bubble mark { background:#3a3413; color:#ffe27a; padding:0 3px; border-radius:3px; }
  .bubble kbd { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; background:#26262f; border:1px solid #3a3a48; border-bottom-width:2px; border-radius:4px; padding:1px 5px; }
  .bubble sub, .bubble sup { font-size:11px; }
  .bubble dl { margin:0 0 10px; }
  .bubble dt { font-weight:600; margin-top:6px; }
  .bubble dd { margin:2px 0 6px 18px; color:#c7ccd6; }
  .bubble .footnotes { margin-top:14px; font-size:13px; color:#9aa0ab; }
  .bubble .footnotes ol { padding-left:20px; }
  .bubble .fn-ref a { color:#7aa2ff; text-decoration:none; }
  .bubble .mermaid { text-align:center; margin:6px 0 12px; }
  .bubble .mermaid svg { max-width:100%; height:auto; }
  .typing::after { content:"▍"; animation:blink 1s steps(2) infinite; color:#6b7180; }
  @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

  #inputArea { flex:0 0 auto; padding:14px 20px 18px; border-top:1px solid #1d1d25; }
  .input-box {
    max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:#16161d; border:1px solid #2a2a34; border-radius:14px; padding:10px 12px;
  }
  .input-box:focus-within { border-color:#4d6bfe; }
  #input {
    flex:1; resize:none; border:none; outline:none; background:transparent; color:#e6e6e6;
    font-size:15px; line-height:1.6; max-height:160px; min-height:24px; padding:4px 2px;
  }
  #input::placeholder { color:#6b7180; }
  .send {
    width:38px; height:38px; flex:0 0 38px; border-radius:10px; border:none; color:#fff; background:#4d6bfe; font-size:18px;
  }
  .send:disabled { background:#2a2a34; color:#6b7180; cursor:default; }
  .input-tip { max-width:760px; margin:8px auto 0; color:#6b7180; font-size:11.5px; text-align:center; }

  /* ===== 设置弹窗 ===== */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:40; }
  .modal-card { width:380px; max-width:92vw; background:#16161d; border:1px solid #2a2a34; border-radius:14px; padding:22px; }
  .modal-title { font-size:17px; font-weight:700; margin-bottom:16px; }
  .modal-card label { display:block; font-size:13px; color:#b9bfc9; margin-bottom:7px; }
  #cfgKey { width:100%; padding:11px 13px; font-size:14px; color:#e6e6e6; background:#0f0f15; border:1px solid #2a2a34; border-radius:9px; outline:none; }
  #cfgKey:focus { border-color:#4d6bfe; }
  .modal-tip { color:#6b7180; font-size:11.5px; margin:12px 0 18px; line-height:1.6; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
  .btn-primary { padding:9px 18px; font-size:14px; color:#fff; background:#4d6bfe; border:none; border-radius:9px; }
  .btn-ghost { padding:9px 18px; font-size:14px; color:#cfd3db; background:transparent; border:1px solid #2a2a34; border-radius:9px; }
</style>
</head>
<body>

<!-- 主界面 -->
<div id="app">
  <aside id="sidebar">
    <div class="sb-brand">DeepSeek</div>
    <button id="newChatBtn" class="sb-new">+ 新建对话</button>
    <div id="sessionList" class="sb-sessions"></div>
    <div class="sb-hint">本页由浏览器直连 DeepSeek 官方接口；密钥仅存本机浏览器，不会上传。</div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="model-tag" id="modelTag">deepSeek chat</div>
      <button id="gearBtn" class="gear" title="设置">⚙</button>
    </header>
    <div id="messages"></div>
    <div id="inputArea">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息…"></textarea>
        <button id="sendBtn" class="send">↑</button>
      </div>
      <div class="input-tip">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal" style="display:none">
  <div class="modal-card">
    <div class="modal-title">设置</div>
    <label for="cfgKey">API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
    <label for="cfgModel" style="margin-top:14px">模型</label>
    <select id="cfgModel" style="width:100%;padding:11px 13px;font-size:14px;color:#e6e6e6;background:#0f0f15;border:1px solid #2a2a34;border-radius:9px;outline:none;">
      <option value="reasoner">deepseek-reasoner · 带思考过程</option>
      <option value="chat">deepseek-chat · 普通(无思考)</option>
    </select>
    <div class="modal-tip">首次使用请先填你的 DeepSeek API Key（<code>sk-</code> 开头,从 platform.deepseek.com 获取）。接口：官方 <code>api.deepseek.com</code>（已内置）。密钥仅保存在本机浏览器,不会上传。</div>
    <div class="modal-actions">
      <button id="cfgSave" class="btn-primary">保存</button>
      <button id="cfgClose" class="btn-ghost">取消</button>
    </div>
  </div>
</div>

<script>
/* 无密码门禁：填入 API Key 即可直接使用 */

/* 固定配置（界面隐藏：接口地址 + 温度）；模型可在设置里切换 */
var API_BASE = 'https://api.deepseek.com';
var TEMP     = 1;
var MODEL_CHOICES = { reasoner:'deepseek-reasoner', chat:'deepseek-chat' };
var modelChoice = localStorage.getItem('ds_model') || 'reasoner';
function currentModel(){ return MODEL_CHOICES[modelChoice] || 'deepseek-reasoner'; }

var els = {
  app: document.getElementById('app'),
  modelTag: document.getElementById('modelTag'),
  messages: document.getElementById('messages'),
  input: document.getElementById('input'),
  send: document.getElementById('sendBtn'),
  newChat: document.getElementById('newChatBtn'),
  sessionList: document.getElementById('sessionList'),
  gear: document.getElementById('gearBtn'),
  modal: document.getElementById('settingsModal'),
  cfgKey: document.getElementById('cfgKey'),
  cfgModel: document.getElementById('cfgModel'),
  cfgSave: document.getElementById('cfgSave'),
  cfgClose: document.getElementById('cfgClose')
};

/* ===== 初始化（无密码，进入即可用） ===== */
function boot(){
  loadCfg();
  loadSessions();
  renderSidebar();
  renderMessages(getActive().messages);
  if (!localStorage.getItem('ds_key')) openSettings();
}

/* ===== 设置 ===== */
function updateModelTag(){
  els.modelTag.textContent = (modelChoice === 'reasoner') ? 'deepSeek reasoner · 思考' : 'deepSeek chat';
}
function loadCfg(){
  els.cfgKey.value = localStorage.getItem('ds_key') || '';
  els.cfgModel.value = modelChoice;
  updateModelTag();
}
function openSettings(){ loadCfg(); els.modal.style.display = 'flex'; els.cfgKey.focus(); }
function closeSettings(){ els.modal.style.display = 'none'; }
els.gear.onclick = openSettings;
els.cfgClose.onclick = closeSettings;
els.cfgSave.onclick = function(){
  localStorage.setItem('ds_key', els.cfgKey.value.trim());
  modelChoice = els.cfgModel.value;
  localStorage.setItem('ds_model', modelChoice);
  updateModelTag();
  closeSettings();
};
els.modal.addEventListener('click', function(e){ if (e.target === els.modal) closeSettings(); });

/* ===== 会话状态（多会话，持久化到 localStorage） ===== */
var SESSIONS_KEY = 'ds_sessions_v1';
var ACTIVE_KEY   = 'ds_active_v1';
var sessions = [];
var activeId = null;
var controller = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadSessions(){
  try { sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY)); } catch(e){ sessions = null; }
  if (!Array.isArray(sessions) || sessions.length === 0){
    sessions = [{ id: uid(), title:'新对话', messages:[] }];
  }
  var aid = localStorage.getItem(ACTIVE_KEY);
  activeId = (aid && sessions.some(function(s){ return s.id === aid; })) ? aid : sessions[0].id;
}
function saveSessions(){
  try {
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    localStorage.setItem(ACTIVE_KEY, activeId);
  } catch(e){}
}
function getActive(){ return sessions.filter(function(s){ return s.id === activeId; })[0] || sessions[0]; }

function renderSidebar(){
  els.sessionList.innerHTML = '';
  for (var i = sessions.length - 1; i >= 0; i--){
    (function(s){
      var item = document.createElement('div');
      item.className = 'sb-session' + (s.id === activeId ? ' active' : '');
      item.textContent = s.title || '新对话';
      item.title = s.title || '新对话';
      item.onclick = function(){ switchSession(s.id); };
      els.sessionList.appendChild(item);
    })(sessions[i]);
  }
}

/* 构造可折叠思考面板 */
function buildThinkBlock(reasoning, open){
  var wrap = document.createElement('details');
  wrap.className = 'think-box';
  if (open) wrap.open = true;
  var sum = document.createElement('summary');
  sum.innerHTML = '<span class="chev">▶</span><span class="tlabel">💡 思考过程</span>';
  wrap.appendChild(sum);
  var body = document.createElement('div');
  body.className = 'think-body';
  body.textContent = reasoning;
  wrap.appendChild(body);
  return wrap;
}

function renderMessages(msgs){
  els.messages.innerHTML = '';
  for (var i = 0; i < msgs.length; i++){
    var m = msgs[i];
    if (m.role === 'user'){
      var ub = addMsg('user'); ub.textContent = m.content;
    } else {
      var ab = addMsg('ai');
      if (m.reasoning) ab.appendChild(buildThinkBlock(m.reasoning, false));
      var ans = document.createElement('div');
      ab.appendChild(ans);
      paintBubble(ans, renderMarkdownLite(m.content || ''));
    }
  }
  els.messages.scrollTop = els.messages.scrollHeight;
}

function switchSession(id){
  if (controller) controller.abort();
  activeId = id;
  saveSessions();
  renderSidebar();
  renderMessages(getActive().messages);
  els.input.value = '';
  autoGrow();
}

els.newChat.onclick = function(){
  if (controller) controller.abort();
  var s = { id: uid(), title:'新对话', messages:[] };
  sessions.push(s);
  activeId = s.id;
  saveSessions();
  renderSidebar();
  els.messages.innerHTML = '';
  els.input.value = '';
  autoGrow();
};

function autoGrow(){
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 160) + 'px';
}
els.input.addEventListener('input', autoGrow);
els.input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

function addMsg(role){
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.appendChild(bubble);
  els.messages.appendChild(wrap);
  els.messages.scrollTop = els.messages.scrollHeight;
  return bubble;
}

function showNotice(text){
  var n = document.createElement('div');
  n.style.cssText = 'max-width:760px;margin:0 auto 18px;padding:10px 20px;color:#ffb86b;font-size:13px;line-height:1.7;background:#1c1622;border:1px solid #3a2b1f;border-radius:10px;';
  n.textContent = text;
  els.messages.appendChild(n);
  els.messages.scrollTop = els.messages.scrollHeight;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* 行内 Markdown：高亮 / 加粗 / 斜体 / 删除线 / 行内代码 / 链接 / 脚注 / 安全HTML白名单 */
function renderInline(s){
  var codes = [];
  s = s.replace(/`([^`\n]+)`/g, function(_, c){ var id = codes.length; codes.push('<code>'+c+'</code>'); return '\u0001'+id+'\u0001'; });
  s = s.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, t, u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>'; });
  s = s.replace(/\[\^([^\]]+)\]/g, function(_, id){ return '<sup class="fn-ref"><a href="#fn-'+id+'">['+id+']</a></sup>'; });
  s = s.replace(/\u0001(\d+)\u0001/g, function(_, i){ return codes[+i]; });
  // 允许安全的行内 HTML 标签（白名单，其余保持转义防 XSS）
  s = s.replace(/&lt;(mark|u|sub|sup|kbd|b|i|small|ins)&gt;([\s\S]*?)&lt;\/\1&gt;/g, '<$1>$2</$1>');
  return s;
}

/* 表格行判断 */
function mdIsRow(line){ return line.trim().charAt(0) === '|' && line.indexOf('|', 1) !== -1; }
function mdIsSep(line){
  if (!mdIsRow(line)) return false;
  var cells = line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
  return cells.every(function(c){ return /^:?-{2,}:?$/.test(c.trim()); });
}
function mdSplitRow(line){
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c){ return c.trim(); });
}
function mdAlign(line){
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c){
    c = c.trim(); var l = c.charAt(0) === ':', r = c.charAt(c.length-1) === ':';
    if (l && r) return 'center'; if (r) return 'right'; if (l) return 'left'; return '';
  });
}
function mdAlignAttr(a){ return a ? ' style="text-align:'+a+'"' : ''; }

/* 完整 Markdown 渲染：代码块 / 公式 / 表格 / 标题 / 列表 / 引用 / 定义列表 / 脚注 / 分割线 / 段落 / 行内 */
function renderMarkdownLite(text){
  // 0) 保护数学公式（避免被加粗/斜体规则破坏）
  var mathStore = [];
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, function(_, c){ var id = mathStore.length; mathStore.push('$$'+c+'$$'); return '\u0002'+id+'\u0002'; });
  text = text.replace(/\$([^\$\n]+?)\$/g, function(_, c){ var id = mathStore.length; mathStore.push('$'+c+'$'); return '\u0002'+id+'\u0002'; });
  // 1) 保护围栏代码块（mermaid 单独标记）
  var codeBlocks = [];
  text = text.replace(/```([\s\S]*?)```/g, function(_, c){
    var inner = c == null ? '' : c.replace(/^\n/, '');
    var lm = inner.match(/^([a-zA-Z0-9_+-]+)\n([\s\S]*)$/);
    var id = codeBlocks.length;
    if (lm && lm[1].toLowerCase() === 'mermaid'){
      codeBlocks.push({ type:'mermaid', body: lm[2] });
    } else {
      codeBlocks.push({ type:'code', html: '<pre><code>'+ escapeHtml(inner) +'</code></pre>' });
    }
    return '\n\u0000CODE'+id+'\u0000\n';
  });
  // 2) 转义其余文本
  text = escapeHtml(text);
  // 3) 逐行分块
  var lines = text.split('\n'), out = [], i = 0, para = [];
  var footnotes = {};
  function flushPara(){
    if (para.length){ out.push('<p>'+ renderInline(para.join('<br>')) +'</p>'); para = []; }
  }
  while (i < lines.length){
    var line = lines[i];
    var cp = line.match(/^\u0000CODE(\d+)\u0000$/);
    if (cp){
      flushPara();
      var cb = codeBlocks[+cp[1]];
      out.push(cb.type === 'mermaid' ? '<div class="mermaid">'+escapeHtml(cb.body)+'</div>' : cb.html);
      i++; continue;
    }
    var mp = line.match(/^\u0002(\d+)\u0002$/);
    if (mp){ flushPara(); out.push(mathStore[+mp[1]]); i++; continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)){ flushPara(); out.push('<hr>'); i++; continue; }
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){ flushPara(); var lv = h[1].length; out.push('<h'+lv+'>'+renderInline(h[2])+'</h'+lv+'>'); i++; continue; }
    var fn = line.match(/^\[\^([^\]]+)\]:\s+(.*)$/);
    if (fn){ footnotes[fn[1]] = renderInline(fn[2]); i++; continue; }
    // 嵌套引用
    if (/^\s*(&gt;)+\s?/.test(line)){
      var q = [];
      while (i < lines.length && /^\s*(&gt;)+\s?/.test(lines[i])){
        var mm = lines[i].match(/^(\s*((?:&gt;)+))\s?(.*)$/);
        var depth = (mm[2].match(/&gt;/g) || []).length;
        q.push({ depth: depth, text: mm[3] });
        i++;
      }
      flushPara();
      var minD = q.reduce(function(a, b){ return Math.min(a, b.depth); }, 99);
      out.push('<blockquote>'+ renderNestedQuotes(q, 0, minD).html +'</blockquote>');
      continue;
    }
    // 定义列表（术语 + : 定义）
    if (i + 1 < lines.length && /^\s*: /.test(lines[i+1])){
      flushPara();
      var term = renderInline(line);
      var dds = [];
      i++;
      while (i < lines.length && /^\s*: /.test(lines[i])){ dds.push(renderInline(lines[i].replace(/^\s*: /, ''))); i++; }
      out.push('<dl><dt>'+term+'</dt>'+ dds.map(function(d){ return '<dd>'+d+'</dd>'; }).join('') +'</dl>');
      continue;
    }
    if (mdIsRow(line) && i+1 < lines.length && mdIsSep(lines[i+1])){
      var header = mdSplitRow(line), align = mdAlign(lines[i+1]); i += 2;
      var rows = [];
      while (i < lines.length && mdIsRow(lines[i])){ rows.push(mdSplitRow(lines[i])); i++; }
      var t = '<div class="md-table"><table><thead><tr>'+
        header.map(function(c, idx){ return '<th'+mdAlignAttr(align[idx])+'>'+renderInline(c)+'</th>'; }).join('')+
        '</tr></thead><tbody>'+
        rows.map(function(r){ return '<tr>'+ r.map(function(c, idx){ return '<td'+mdAlignAttr(align[idx])+'>'+renderInline(c)+'</td>'; }).join('') +'</tr>'; }).join('')+
        '</tbody></table></div>';
      flushPara(); out.push(t); continue;
    }
    if (/^\s*[-*+]\s+/.test(line)){
      var ul = [], anyTask = false;
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
        var raw = lines[i].replace(/^\s*[-*+]\s+/, '');
        var tm = raw.match(/^\[([ xX])\]\s+(.*)$/);
        if (tm){
          anyTask = true;
          var checked = (tm[1].toLowerCase() === 'x') ? ' checked' : '';
          ul.push('<li class="task"><input type="checkbox" disabled'+checked+'> '+renderInline(tm[2])+'</li>');
        } else {
          ul.push('<li>'+renderInline(raw)+'</li>');
        }
        i++;
      }
      flushPara(); out.push('<ul'+(anyTask?' class="task-list"':'')+'>'+ul.join('')+'</ul>'); continue;
    }
    if (/^\s*\d+\.\s+/.test(line)){
      var ol = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){ ol.push('<li>'+renderInline(lines[i].replace(/^\s*\d+\.\s+/, ''))+'</li>'); i++; }
      flushPara(); out.push('<ol>'+ol.join('')+'</ol>'); continue;
    }
    if (line.trim() === ''){ flushPara(); i++; continue; }
    para.push(line); i++;
  }
  flushPara();
  var htmlStr = out.join('');
  // 4) 还原公式占位符（已转义，安全）
  htmlStr = htmlStr.replace(/\u0002(\d+)\u0002/g, function(_, i2){ return escapeHtml(mathStore[+i2]); });
  // 5) 脚注列表
  var fkeys = Object.keys(footnotes);
  if (fkeys.length){
    htmlStr += '<div class="footnotes"><hr><ol>' +
      fkeys.map(function(k){ return '<li id="fn-'+k+'">'+footnotes[k]+'</li>'; }).join('') +
      '</ol></div>';
  }
  return htmlStr;
}

/* 嵌套引用递归渲染 */
function renderNestedQuotes(items, idx, depth){
  var buf = [];
  while (idx < items.length && items[idx].depth >= depth){
    if (items[idx].depth === depth){ buf.push(renderInline(items[idx].text)); idx++; }
    else { var sub = renderNestedQuotes(items, idx, depth + 1); buf.push('<blockquote>'+sub.html+'</blockquote>'); idx = sub.idx; }
  }
  return { html: buf.join('<br>'), idx: idx };
}

/* ===== KaTeX 数学公式渲染（按需从 CDN 加载） ===== */
var katexState = 0; // 0 未加载 1 加载中 2 就绪 -1 失败
function ensureKatex(cb){
  if (katexState === 2){ cb(); return; }
  if (katexState === -1){ return; }
  if (katexState === 1){ setTimeout(function(){ ensureKatex(cb); }, 150); return; }
  katexState = 1;
  var css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';
  document.head.appendChild(css);
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';
  s.onload = function(){
    var ar = document.createElement('script');
    ar.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js';
    ar.onerror = function(){ katexState = -1; };
    ar.onload = function(){ katexState = 2; cb(); };
    document.head.appendChild(ar);
  };
  s.onerror = function(){ katexState = -1; };
  document.head.appendChild(s);
}
function renderMath(el){
  if (window.renderMathInElement){
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left:'$$', right:'$$', display:true },
          { left:'$', right:'$', display:false },
          { left:'\\(', right:'\\)', display:false },
          { left:'\\[', right:'\\]', display:true }
        ],
        throwOnError: false
      });
    } catch(e){}
  } else {
    ensureKatex(function(){ renderMath(el); });
  }
}
/* 设置气泡内容并渲染公式 / 图表 */
function paintBubble(el, html){
  el.innerHTML = html;
  renderMath(el);
  renderMermaidIn(el);
}

/* ===== Mermaid 图表渲染（按需从 CDN 加载） ===== */
var mermaidState = 0; // 0 未加载 1 加载中 2 就绪 -1 失败
function ensureMermaid(cb){
  if (mermaidState === 2){ cb(); return; }
  if (mermaidState === -1){ return; }
  if (mermaidState === 1){ setTimeout(function(){ ensureMermaid(cb); }, 150); return; }
  mermaidState = 1;
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mermaid@9.3.0/dist/mermaid.min.js';
  s.onload = function(){ try { window.mermaid.initialize({ startOnLoad:false, theme:'dark', securityLevel:'loose' }); } catch(e){} mermaidState = 2; cb(); };
  s.onerror = function(){ mermaidState = -1; };
  document.head.appendChild(s);
}
function renderMermaidIn(el){
  var nodes = el.querySelectorAll('.mermaid');
  if (!nodes.length) return;
  if (window.mermaid){
    try {
      nodes.forEach(function(n){
        if (n.dataset.mm) return;
        var id = 'mmd-' + Math.random().toString(36).slice(2);
        window.mermaid.render(id, n.textContent, function(svg){ n.innerHTML = svg; n.dataset.mm = '1'; });
      });
    } catch(e){}
  } else {
    ensureMermaid(function(){ renderMermaidIn(el); });
  }
}

/* ===== 发送（流式） ===== */
function send(){
  var text = els.input.value.trim();
  if (!text) return;
  var key = (localStorage.getItem('ds_key') || '').trim();
  var cur = getActive();
  if (!key){
    showNotice('⚠️ 尚未配置 DeepSeek API Key,无法发送。点右上角 ⚙ 打开设置,粘贴你的 key(sk- 开头,从 platform.deepseek.com 获取)后点「保存」。你的输入已保留在下方。');
    openSettings();
    return;
  }

  var ub = addMsg('user');
  ub.textContent = text;
  cur.messages.push({ role:'user', content:text });
  if (cur.messages.filter(function(m){ return m.role === 'user'; }).length === 1){
    cur.title = text.slice(0, 18) || '新对话';
    renderSidebar();
  }
  saveSessions();
  els.input.value = '';
  autoGrow();

  var ab = addMsg('ai');
  ab.classList.add('typing');
  var full = '', reasoning = '';
  var showThink = (modelChoice === 'reasoner');
  var thinkWrap = null, thinkBody = null, thinkState = null;
  if (showThink){
    thinkWrap = document.createElement('details');
    thinkWrap.className = 'think-box';
    thinkWrap.open = true;
    var thinkSum = document.createElement('summary');
    thinkSum.innerHTML = '<span class="chev">▶</span><span class="tlabel">💡 思考过程</span><span class="tstate">思考中…</span>';
    thinkWrap.appendChild(thinkSum);
    thinkBody = document.createElement('div');
    thinkBody.className = 'think-body typing';
    thinkWrap.appendChild(thinkBody);
    thinkState = thinkSum.querySelector('.tstate');
    ab.appendChild(thinkWrap);
  }
  var ansEl = document.createElement('div');
  ab.appendChild(ansEl);

  controller = new AbortController();
  els.send.disabled = true;
  els.send.textContent = '■';

  fetch(API_BASE + '/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({ model:currentModel(), messages:cur.messages, temperature:TEMP, stream:true }),
    signal: controller.signal
  }).then(function(r){
    if (!r.ok){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,200)); }); }
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    function pump(){
      return reader.read().then(function(res){
        if (res.done){
          ab.classList.remove('typing');
          if (thinkBody){ thinkBody.classList.remove('typing'); if (thinkState) thinkState.textContent = reasoning ? '已完成' : ''; if (reasoning) thinkWrap.open = false; else if (thinkWrap.parentNode) thinkWrap.parentNode.removeChild(thinkWrap); }
          if (full) cur.messages.push({ role:'assistant', content:full, reasoning:reasoning });
          saveSessions();
          return;
        }
        buf += dec.decode(res.value, { stream:true });
        var parts = buf.split('\n'); buf = parts.pop();
        for (var i=0;i<parts.length;i++){
          var line = parts[i].trim();
          if (!line || !line.startsWith('data:')) continue;
          var data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            var j = JSON.parse(data);
            var d = j.choices && j.choices[0] && j.choices[0].delta;
            if (!d) continue;
            if (d.reasoning_content){ reasoning += d.reasoning_content; }
            if (d.content){ full += d.content; }
          } catch(e){ continue; }
        }
        if (thinkBody && reasoning){ thinkBody.textContent = reasoning; thinkBody.classList.add('typing'); }
        if (full) paintBubble(ansEl, renderMarkdownLite(full));
        els.messages.scrollTop = els.messages.scrollHeight;
        return pump();
      });
    }
    return pump();
  }).catch(function(err){
    ab.classList.remove('typing');
    if (err.name === 'AbortError'){
      if (thinkBody){ thinkBody.textContent = reasoning; thinkBody.classList.remove('typing'); if (thinkState) thinkState.textContent = '已中断'; if (reasoning) thinkWrap.open = false; else if (thinkWrap.parentNode) thinkWrap.parentNode.removeChild(thinkWrap); }
      if (full) cur.messages.push({ role:'assistant', content:full, reasoning:reasoning });
      saveSessions();
      paintBubble(ansEl, renderMarkdownLite(full));
    } else {
      if (thinkWrap && thinkWrap.parentNode) thinkWrap.parentNode.removeChild(thinkWrap);
      ab.textContent = '请求失败：' + err.message + '\n（确认 API Key 正确、接口可达）';
    }
  }).then(function(){
    controller = null;
    els.send.disabled = false;
    els.send.textContent = '↑';
  });
}

els.send.onclick = function(){
  if (controller){ controller.abort(); }
  else { send(); }
};

/* 进入页面即初始化（无密码门禁） */
boot();
